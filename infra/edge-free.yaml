AWSTemplateFormatVersion: '2010-09-09'
Description: Personal website edge delivery with a FREE-only CloudFront subscription and WAF.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: Disabled CloudFront -> FREE subscription -> verify ACTIVE -> enable delivery to private Singapore S3.
    must:
      - Deploy in us-east-1 because WAF uses CLOUDFRONT scope.
      - Never upgrade to a paid tier or fall back to pay-as-you-go automatically.
      - Confirm the FREE subscription is ACTIVE before enabling traffic.
      - Each function and web ACL belongs to this distribution only.
    ref:
      - at: ../DEPLOY.md
        has: Activation gate, region order, billing boundaries and rollback.
Parameters:
  OriginBucketName:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'
    Description: BucketName output from the Singapore storage stack in the same account.
  ReleasePrefix:
    Type: String
    Default: releases/20261021-initial
    AllowedPattern: 'releases/[a-zA-Z0-9-]+'
    MaxLength: 100
    Description: Immutable origin directory; publish and roll back by switching this prefix.
  ServeTraffic:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Leave false until the subscription is ACTIVE, origin policy and uploads are verified.
  ManagedCachePolicyId:
    Type: String
    AllowedPattern: '[a-f0-9-]{36}'
    Description: Resolve Managed-CachingOptimized by name from ListCachePolicies before deployment.
  ManagedSecurityHeadersPolicyId:
    Type: String
    AllowedPattern: '[a-f0-9-]{36}'
    Description: Resolve Managed-SecurityHeadersPolicy by name from ListResponseHeadersPolicies.
  RequestsPerFiveMinutes:
    Type: Number
    Default: 1000
    MinValue: 10
    MaxValue: 100000
    Description: Initial per-viewer-IP limit; review Count results before switching to Block.
  RateLimitMode:
    Type: String
    Default: COUNT
    AllowedValues: [COUNT, BLOCK]
    Description: COUNT observes only; after legitimate-traffic review explicitly switch to BLOCK.
Conditions:
  EnforceRateLimit: !Equals [!Ref RateLimitMode, BLOCK]
  TrafficEnabled: !Equals [!Ref ServeTraffic, 'true']
Resources:
  SiteWebACL:
    Type: AWS::WAFv2::WebACL
    Metadata:
      com.aws.cloudformation.Context:
        why: One dedicated ACL with an IP rate rule, within the FREE plan's five-rule allowance.
        must:
          - Use CLOUDFRONT scope and attach to this distribution only.
          - Use viewer IP at the CloudFront WAF edge, not a spoofable forwarded header.
          - COUNT does not block traffic; review samples then enable BLOCK explicitly.
    Properties:
      Name: !Sub '${AWS::StackName}-waf'
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${AWS::StackName}-waf'
      Rules:
        - Name: PerViewerIpRateLimit
          Priority: 0
          Action: !If
            - EnforceRateLimit
            - Block: {}
            - Count: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref RequestsPerFiveMinutes
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${AWS::StackName}-ip-rate'
  FreeSubscription:
    Type: AWS::PricingPlanManager::Subscription
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Fixes the covered CDN, WAF and edge compute price at the FREE tier; retained to avoid accidental cancellation.
        must:
          - PlanTier must stay FREE; no tier parameter or paid approval operation.
          - Distribution stays disabled until GetSubscription reports ACTIVE and current tier FREE.
          - Removing a subscription restores usage billing; never cancel it while traffic is enabled.
    Properties:
      PlanFamily: CloudFront
      PlanTier: FREE
      UsageLevel: DEFAULT
      ResourceArns:
        - !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
        - !GetAtt SiteWebACL.Arn
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Metadata:
      com.aws.cloudformation.Context:
        why: Signs origin requests so S3 never needs anonymous read access.
        must: [Always sign S3 REST requests using SigV4.]
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  DirectoryIndex:
    Type: AWS::CloudFront::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: S3 REST origins do not resolve Astro directory index pages.
        must: [Rewrite directories and extensionless routes; leave static assets unchanged.]
    Properties:
      Name: !Sub '${AWS::StackName}-index'
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve Astro directory routes to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (uri.split('/').pop().indexOf('.') === -1) {
            request.uri += '/index.html';
          }
          return request;
        }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: Global HTTPS on the AWS default domain; no servers, hosted zones or custom certificates.
        must: [Use OAC with private S3 REST origin; missing pages must return HTTP 404.]
    Properties:
      DistributionConfig:
        Comment: !Sub '${AWS::StackName} personal website'
        Enabled: !Ref ServeTraffic
        WebACLId: !GetAtt SiteWebACL.Arn
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        Origins:
          - Id: private-s3
            DomainName: !Sub '${OriginBucketName}.s3.ap-southeast-1.${AWS::URLSuffix}'
            OriginPath: !Sub '/${ReleasePrefix}'
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: private-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref ManagedCachePolicyId
          ResponseHeadersPolicyId: !Ref ManagedSecurityHeadersPolicyId
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DirectoryIndex.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
  AccessLogs:
    Type: AWS::Logs::LogGroup
    Condition: TrafficEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Compact standard access logs for traffic review; AWS-managed encryption avoids a recurring customer-key charge.
        must: [Do not record query strings or cookies; retain the log group on stack removal.]
    Properties:
      LogGroupName: !Sub '/aws/cloudfront/${AWS::StackName}'
      RetentionInDays: 7
  AccessLogSource:
    Type: AWS::Logs::DeliverySource
    Condition: TrafficEnabled
    Metadata:
      com.aws.cloudformation.Context:
        why: V2 standard log source for this distribution; created only after the FREE activation gate.
        must: [Use ACCESS_LOGS; do not enable real-time logs.]
    Properties:
      Name: !Sub '${AWS::StackName}-access'
      ResourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
      LogType: ACCESS_LOGS
  AccessLogDestination:
    Type: AWS::Logs::DeliveryDestination
    Condition: TrafficEnabled
    Metadata:
      com.aws.cloudformation.Context:
        why: CloudWatch delivery is covered for ingestion by the active plan; storage and queries remain separate.
        must: [Use JSON; no Firehose or Parquet conversion.]
    Properties:
      Name: !Sub '${AWS::StackName}-access'
      DestinationResourceArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/cloudfront/${AWS::StackName}'
      OutputFormat: json
  AccessLogPolicy:
    Type: AWS::Logs::ResourcePolicy
    Condition: TrafficEnabled
    Metadata:
      com.aws.cloudformation.Context:
        why: Restricts the vended-logs writer to this account and exact delivery source.
        must: [Grant delivery service writes only to the dedicated log group.]
    Properties:
      PolicyName: !Sub '${AWS::StackName}-access'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !GetAtt AccessLogs.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !GetAtt AccessLogSource.Arn
  AccessLogDelivery:
    Type: AWS::Logs::Delivery
    Condition: TrafficEnabled
    DependsOn: [AccessLogPolicy, AccessLogSource]
    Metadata:
      com.aws.cloudformation.Context:
        why: Minimal fields support status, request volume and cache diagnostics without cookie or query leakage.
        must: [Exclude query strings, cookies, authorization, referer and user-agent.]
    Properties:
      DeliverySourceName: !Sub '${AWS::StackName}-access'
      DeliveryDestinationArn: !GetAtt AccessLogDestination.Arn
      RecordFields: [date, time, c-ip, cs-method, cs-uri-stem, sc-status, sc-bytes, x-edge-result-type, x-edge-request-id, time-taken]
Outputs:
  DistributionId:
    Description: Global CloudFront distribution ID.
    Value: !Ref Distribution
  DistributionArn:
    Description: Pass this exact ARN to the Singapore storage stack after activation.
    Value: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
  WebsiteUrl:
    Description: Default HTTPS URL; initially disabled until FREE plan activation is confirmed.
    Value: !Sub 'https://${Distribution.DomainName}'
  SubscriptionArn:
    Description: Verify ACTIVE state and FREE current tier before enabling traffic.
    Value: !Ref FreeSubscription
  WebACLArn:
    Description: Dedicated CLOUDFRONT WAF ACL associated with both distribution and plan.
    Value: !GetAtt SiteWebACL.Arn
  ReleasePrefix:
    Description: Active S3 release directory, independent of bucket history.
    Value: !Ref ReleasePrefix
  DirectoryIndexFunctionName:
    Description: Published viewer-request function for Astro directory routes.
    Value: !Ref DirectoryIndex
